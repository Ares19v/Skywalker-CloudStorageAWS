<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CompanyDB — The Vault</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <div class="page-header">
      <div class="page-header-left">
        <h1>The Vault</h1>
        <p>All submissions from your team — search, sort, and explore</p>
      </div>
      <a class="btn btn-primary" href="/input">+ New Entry</a>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-wrap">
        <i class="search-icon">⌕</i>
        <input class="search-input" type="text" id="searchInput" placeholder="Search by user, department, content…" />
      </div>
      <select class="filter-select" id="deptFilter">
        <option value="">All Departments</option>
        <option>Engineering</option><option>Marketing</option><option>Sales</option>
        <option>HR</option><option>Design</option><option>Operations</option>
        <option>Finance</option><option>Management</option>
      </select>
      <select class="filter-select" id="typeFilter">
        <option value="">All Types</option>
        <option>Ad</option><option>Link</option><option>Note</option>
        <option>Image</option><option>Video</option><option>PDF</option>
        <option>Code</option><option>Document</option><option>Presentation</option><option>Other</option>
      </select>
      <button class="btn btn-ghost btn-sm" id="refreshBtn">↻ Refresh</button>
    </div>

    <div class="page-content" style="padding-top:20px;">
      <div class="card" style="padding:0;overflow:hidden;">
        <div class="table-wrap">
          <table id="vaultTable">
            <thead>
              <tr>
                <th data-col="id"              class="sorted">ID <span class="sort-arrow">↓</span></th>
                <th data-col="username">        User</th>
                <th data-col="department_name">Dept</th>
                <th data-col="content_type">   Type</th>
                <th>                           Content</th>
                <th data-col="created_at">     Date</th>
                <th>                           Actions</th>
              </tr>
            </thead>
            <tbody id="vaultBody">
              <tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text3);">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div id="rowCount" style="font-size:.75rem;color:var(--text3);margin-top:12px;text-align:right;"></div>
    </div>
  </main>
</div>

<!-- Preview Modal -->
<div class="modal-backdrop" id="previewModal">
  <div class="modal" style="max-width:640px;">
    <div class="modal-header">
      <div>
        <h2 id="modalTitle">Entry Preview</h2>
        <div class="card-subtitle" id="modalMeta"></div>
      </div>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div id="modalBody" style="max-height:60vh;overflow-y:auto;"></div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="/js/shared.js"></script>
<script>
const CONTENT_ICONS = { Ad:'📣', Link:'🔗', Note:'📝', Image:'🖼️', Video:'🎬', PDF:'📕', Code:'💻', Document:'📄', Presentation:'📊', Other:'📦' };
const BADGE_CLASS   = { Ad:'badge-yellow', Link:'badge-blue', Note:'badge-neutral', Image:'badge-green', Video:'badge-green', PDF:'badge-red', Code:'badge-blue', Document:'badge-neutral', Presentation:'badge-yellow', Other:'badge-neutral' };

let allRows = [], sortCol = 'id', sortDir = 'desc';

async function loadVault() {
  const search = document.getElementById('searchInput').value.trim();
  const dept   = document.getElementById('deptFilter').value;
  const type   = document.getElementById('typeFilter').value;
  const params = new URLSearchParams({ sort: sortCol, order: sortDir });
  if (search) params.set('search', search);
  if (dept)   params.set('department', dept);
  if (type)   params.set('type', type);

  const res  = await fetch('/api/submissions?' + params);
  allRows = await res.json();
  renderTable(allRows);
}

function renderTable(rows) {
  const tbody = document.getElementById('vaultBody');
  document.getElementById('rowCount').textContent = rows.length + ' entries';
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><span class="empty-icon">🗄️</span><h3>No entries found</h3><p>Try adjusting your filters or submit something new.</p></div></td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map(r => {
    const icon   = CONTENT_ICONS[r.content_type] || '📦';
    const badge  = BADGE_CLASS[r.content_type] || 'badge-neutral';
    const date   = new Date(r.created_at).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
    const preview = r.file_name
      ? `<span style="color:var(--text3);font-size:.78rem;">📎 ${escHtml(r.file_name)}</span>`
      : (r.data_body ? `<span class="td-truncate" style="display:block;max-width:260px;">${escHtml(r.data_body.substring(0,120))}</span>` : '<span style="color:var(--text3);">—</span>');
    const delBtn = r.can_delete
      ? `<button class="btn btn-danger btn-sm" onclick="deleteEntry(${r.id})">Delete</button>`
      : '';
    return `<tr>
      <td class="td-mono">#${r.id}</td>
      <td><strong>${escHtml(r.username)}</strong></td>
      <td><span class="badge badge-neutral">${escHtml(r.department_name)}</span></td>
      <td><span class="badge ${badge}">${icon} ${escHtml(r.content_type)}</span></td>
      <td style="cursor:pointer;" onclick='openPreview(${JSON.stringify(r)})'>${preview}</td>
      <td class="td-mono" style="white-space:nowrap;">${date}</td>
      <td style="white-space:nowrap;">
        <button class="btn btn-ghost btn-sm" onclick='openPreview(${JSON.stringify(r)})'>View</button>
        ${delBtn}
      </td>
    </tr>`;
  }).join('');
}

function openPreview(r) {
  const icon = CONTENT_ICONS[r.content_type] || '📦';
  document.getElementById('modalTitle').textContent = `${icon} ${r.content_type}`;
  document.getElementById('modalMeta').textContent = `${r.username} · ${r.department_name} · ${new Date(r.created_at).toLocaleString('en-IN')}`;
  const body = document.getElementById('modalBody');

  if (r.file_path) {
    const mime = r.mime_type || '';
    if (mime.startsWith('image/')) {
      body.innerHTML = `<img src="${r.file_path}" alt="${escHtml(r.file_name)}" style="max-width:100%;border-radius:8px;" />`;
    } else if (mime.startsWith('video/')) {
      body.innerHTML = `<video src="${r.file_path}" controls style="max-width:100%;border-radius:8px;"></video>`;
    } else if (mime === 'application/pdf') {
      body.innerHTML = `<iframe src="${r.file_path}" style="width:100%;height:400px;border:none;border-radius:8px;"></iframe>`;
    } else {
      body.innerHTML = `<div style="padding:20px;text-align:center;"><div style="font-size:3rem;">📎</div><p style="margin-top:12px;"><a href="${r.file_path}" download="${escHtml(r.file_name)}" class="btn btn-primary">Download ${escHtml(r.file_name)}</a></p><p style="margin-top:8px;color:var(--text3);font-size:.78rem;">${formatBytes(r.file_size)}</p></div>`;
    }
  } else if (r.data_body) {
    const isCode = r.content_type === 'Code';
    body.innerHTML = isCode
      ? `<pre style="background:var(--bg3);padding:16px;border-radius:8px;overflow-x:auto;font-family:var(--mono);font-size:.82rem;line-height:1.6;">${escHtml(r.data_body)}</pre>`
      : `<p style="white-space:pre-wrap;color:var(--text);line-height:1.75;">${escHtml(r.data_body)}</p>`;
  } else {
    body.innerHTML = `<p style="color:var(--text3);">No content.</p>`;
  }
  document.getElementById('previewModal').classList.add('open');
}

async function deleteEntry(id) {
  if (!confirm('Delete this entry permanently?')) return;
  const res = await fetch(`/api/submissions/${id}`, { method: 'DELETE' });
  const data = await res.json();
  if (data.success) { showToast('Entry deleted', 'success'); loadVault(); }
  else showToast(data.error || 'Failed to delete', 'error');
}

// Sort
document.querySelectorAll('thead th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) sortDir = sortDir === 'desc' ? 'asc' : 'desc';
    else { sortCol = col; sortDir = 'desc'; }
    document.querySelectorAll('thead th').forEach(t => { t.classList.remove('sorted'); t.querySelector('.sort-arrow') && (t.querySelector('.sort-arrow').textContent = ''); });
    th.classList.add('sorted');
    const arrow = th.querySelector('.sort-arrow') || (() => { const s = document.createElement('span'); s.className = 'sort-arrow'; th.appendChild(s); return s; })();
    arrow.textContent = sortDir === 'desc' ? ' ↓' : ' ↑';
    loadVault();
  });
});

let searchTimer;
document.getElementById('searchInput').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(loadVault, 300); });
document.getElementById('deptFilter').addEventListener('change', loadVault);
document.getElementById('typeFilter').addEventListener('change', loadVault);
document.getElementById('refreshBtn').addEventListener('click', loadVault);

document.getElementById('modalClose').addEventListener('click', () => document.getElementById('previewModal').classList.remove('open'));
document.getElementById('previewModal').addEventListener('click', (e) => { if (e.target === document.getElementById('previewModal')) document.getElementById('previewModal').classList.remove('open'); });

function escHtml(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function formatBytes(b) { if (!b) return ''; if (b < 1024) return b+' B'; if (b < 1048576) return (b/1024).toFixed(1)+' KB'; return (b/1048576).toFixed(1)+' MB'; }

loadVault();
</script>
</body>
</html>
