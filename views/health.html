<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Skywalker — Database Health</title>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <div class="page-header">
      <div class="page-header-left">
        <h1>Database Health</h1>
        <p>Live diagnostics, system performance, and storage metrics</p>
      </div>
      <button class="btn btn-ghost btn-sm" id="refreshBtn">Refresh</button>
    </div>

    <div class="page-content">
      <div id="healthContent"><div style="text-align:center;padding:60px;color:var(--text-sub);">Loading diagnostics…</div></div>
    </div>
  </main>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="/js/shared.js"></script>
<script>
async function loadHealth() {
  try {
    const res  = await fetch('/api/health');
    const data = await res.json();
    if (data.error) { document.getElementById('healthContent').innerHTML = `<div class="card"><p style="color:var(--danger);">Error: ${data.error}</p></div>`; return; }
    renderHealth(data);
  } catch(e) {
    document.getElementById('healthContent').innerHTML = `<div class="card"><p style="color:var(--danger);">Could not reach server</p></div>`;
  }
}

function renderHealth(d) {
  const { system, db, storage, breakdown, recent } = d;
  const memUsed = Math.round((system.totalMem - system.freeMem) / 1024 / 1024);
  const memTotal = Math.round(system.totalMem / 1024 / 1024);
  const memPct = Math.round((memUsed / memTotal) * 100);

  document.getElementById('healthContent').innerHTML = `
    <!-- Top Stats -->
    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-label">Total Submissions</div>
        <div class="metric-value">${db.totalSubmissions || 0}</div>
        <div class="metric-sub">Stored in vault</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Team Users</div>
        <div class="metric-value">${db.totalUsers || 0}</div>
        <div class="metric-sub">Active members</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Database Size</div>
        <div class="metric-value">${db.size || '0 MB'}</div>
        <div class="metric-sub">${db.engine}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Memory Usage</div>
        <div class="metric-value">${memPct}%</div>
        <div class="metric-sub">${memUsed} MB / ${memTotal} MB</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;">
      <!-- System Specs -->
      <div class="card">
        <div class="card-title">Server Environment</div>
        <div class="card-subtitle">Host machine runtime and specs</div>
        <div style="display:flex;flex-direction:column;gap:12px;font-size:0.88rem;">
          <div style="display:flex;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid var(--border-sub);">
            <span style="color:var(--text-muted);">OS Platform</span>
            <strong style="color:var(--text-main);">${system.platform} (${system.arch})</strong>
          </div>
          <div style="display:flex;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid var(--border-sub);">
            <span style="color:var(--text-muted);">CPU Cores</span>
            <strong style="color:var(--text-main);">${system.cpus} Logical Processors</strong>
          </div>
          <div style="display:flex;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid var(--border-sub);">
            <span style="color:var(--text-muted);">System Uptime</span>
            <strong style="color:var(--text-main);">${formatUptime(system.uptime)}</strong>
          </div>
          <div style="display:flex;justify-content:space-between;">
            <span style="color:var(--text-muted);">Storage Mode</span>
            <strong style="color:var(--text-main);">${storage.mode}</strong>
          </div>
        </div>
      </div>

      <!-- Department Distribution -->
      <div class="card">
        <div class="card-title">Department Distribution</div>
        <div class="card-subtitle">Entries by organizational unit</div>
        <div style="display:flex;flex-direction:column;gap:10px;font-size:0.88rem;">
          ${(breakdown.byDepartment || []).map(r => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:6px;border-bottom:1px solid var(--border-sub);">
              <span style="color:var(--text-main);font-weight:500;">${r.department_name}</span>
              <span class="badge badge-neutral">${r.count} entries</span>
            </div>
          `).join('') || '<div style="color:var(--text-sub);">No department entries yet</div>'}
        </div>
      </div>
    </div>

    <!-- Content Type Breakdown -->
    <div class="card">
      <div class="card-title">Content Categories</div>
      <div class="card-subtitle">Breakdown of all submissions by content format</div>
      <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;">
        ${(breakdown.byContent || []).map(r => `
          <div style="background:#f9fafb;border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 18px;min-width:140px;">
            <div style="font-size:0.75rem;font-weight:600;color:var(--text-sub);text-transform:uppercase;">${r.content_type}</div>
            <div style="font-size:1.4rem;font-weight:800;color:var(--text-main);margin-top:2px;">${r.count}</div>
          </div>
        `).join('') || '<div style="color:var(--text-sub);">No content logged</div>'}
      </div>
    </div>
  `;
}

function formatUptime(s) {
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
  return h ? `${h}h ${m}m` : `${m}m`;
}

document.getElementById('refreshBtn').addEventListener('click', loadHealth);
loadHealth();
</script>
</body>
</html>
