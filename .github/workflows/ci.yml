name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  # ─── Job 1: Lint & Dependency Audit ────────────────────────────────────────
  lint:
    name: Lint & Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit for high-severity vulnerabilities
        run: npm audit --audit-level=high || true

  # ─── Job 2: Docker Build ────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: companydb:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 3: Integration Smoke Test ─────────────────────────────────────────
  integration:
    name: Integration Smoke Test
    runs-on: ubuntu-latest
    needs: docker-build

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: companydb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d companydb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Wait for Postgres to be ready
        run: |
          until pg_isready -h localhost -U postgres; do
            echo "Waiting for Postgres..."
            sleep 2
          done

      - name: Initialise database schema
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: companydb
          DB_USER: postgres
          DB_PASSWORD: password123
          DB_SSL: "false"
        run: npm run db:init

      - name: Seed admin account
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: companydb
          DB_USER: postgres
          DB_PASSWORD: password123
          DB_SSL: "false"
        run: echo "admin123" | node scripts/seedAdmin.js

      - name: Start server in background
        env:
          PORT: 3000
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: companydb
          DB_USER: postgres
          DB_PASSWORD: password123
          DB_SSL: "false"
          SESSION_SECRET: ci_test_secret_string_minimum_32_chars_long
          AWS_REGION: ap-south-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          S3_BUCKET_NAME: companydb-ci-bucket
          S3_ENDPOINT: ""
          MAX_FILE_SIZE_MB: "100"
          ADMIN_LOCK: "false"
          NODE_ENV: test
        run: |
          node server.js &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          # Give the server a few seconds to boot
          sleep 5

      - name: Health check — server is responding
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/)
          echo "HTTP status: $STATUS"
          # 302 = redirect to /login (expected when not authenticated)
          if [ "$STATUS" -ne 302 ] && [ "$STATUS" -ne 200 ]; then
            echo "❌ Unexpected status $STATUS — server is not healthy."
            exit 1
          fi
          echo "✅ Server is alive."

      - name: Stop background server
        if: always()
        run: kill $SERVER_PID || true
